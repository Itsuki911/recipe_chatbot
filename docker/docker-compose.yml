services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8501:8501"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg2://recipe_user:recipe_password@db:5432/recipe_chatbot
      MAIN_LLM_BACKEND: openrouter
      RAG_LLM_BACKEND: openrouter
      DEEP_AGENT_LLM_BACKEND: openrouter
      STRUCTURED_LLM_BACKEND: openrouter
      CRAWL4AI_LLM_PROVIDER: openrouter/google/gemma-4-26b-a4b-it:free
      RAG_EMBEDDING_BACKEND: fastembed
      RAG_VECTOR_STORE: turbovec
      OPENROUTER_MODEL: google/gemma-4-26b-a4b-it:free
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      OPENROUTER_APP_TITLE: Recipe RAG Chatbot
      WEB_RECIPE_REFERENCE_DIR: /app/data/web_recipe_reference
    volumes:
      - ../data:/app/data
      - ../ERROR_LOG.md:/app/ERROR_LOG.md
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: recipe_chatbot
      POSTGRES_USER: recipe_user
      POSTGRES_PASSWORD: recipe_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
