services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8501:8501"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg2://recipe_user:recipe_password@db:5432/recipe_chatbot
      RAG_LLM_BACKEND: gemini
      RAG_EMBEDDING_BACKEND: fastembed
      RAG_VECTOR_STORE: turbovec
      GEMINI_MODEL: gemini-2.5-flash
    volumes:
      - ../data:/app/data
      - ../ERROR_LOG.md:/app/ERROR_LOG.md
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: recipe_chatbot
      POSTGRES_USER: recipe_user
      POSTGRES_PASSWORD: recipe_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
