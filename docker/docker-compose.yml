services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8501:8501"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg2://recipe_user:recipe_password@db:5432/recipe_chatbot
      MAIN_LLM_BACKEND: qwen
      RAG_LLM_BACKEND: qwen
      DEEP_AGENT_LLM_BACKEND: qwen
      STRUCTURED_LLM_BACKEND: qwen
      CRAWL4AI_LLM_PROVIDER: ollama/qwen3:4b
      RAG_EMBEDDING_BACKEND: fastembed
      RAG_VECTOR_STORE: turbovec
      GEMINI_MODEL: gemini-2.5-flash
      QWEN_BASE_URL: http://host.docker.internal:11434/v1
      QWEN_OLLAMA_BASE_URL: http://host.docker.internal:11434
      QWEN_MODEL: qwen3:4b
      QWEN_API_KEY: ollama
      WEB_RECIPE_REFERENCE_DIR: /app/data/web_recipe_reference
    volumes:
      - ../data:/app/data
      - ../ERROR_LOG.md:/app/ERROR_LOG.md
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: recipe_chatbot
      POSTGRES_USER: recipe_user
      POSTGRES_PASSWORD: recipe_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
